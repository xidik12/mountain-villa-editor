server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache on assets, none on the HTML
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve files; fall back to index.html for SPA-style routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Permissive CORS so the editor can be embedded if needed
    add_header Access-Control-Allow-Origin "*";
}
